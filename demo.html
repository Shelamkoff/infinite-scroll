<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Infinite Scroll demo">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>↧</text></svg>">
  <title>Infinite Scroll — live demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #080b12;
      color: #eef2ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: 1rem max(1rem, calc((100vw - 760px) / 2));
      background: rgba(8, 11, 18, .86);
      border-bottom: 1px solid #232a3d;
      backdrop-filter: blur(16px);
    }
    h1 { margin: 0; font-size: clamp(1.05rem, 3vw, 1.4rem); }
    .status { color: #9ba8c7; font-size: .875rem; }
    button {
      border: 1px solid #3c4a70;
      border-radius: 999px;
      padding: .65rem 1rem;
      color: #eef2ff;
      background: #171d2e;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #252e47; }
    main { width: min(100% - 2rem, 760px); margin: 2rem auto 7rem; }
    .intro { color: #aeb9d4; line-height: 1.65; }
    .feed { display: grid; gap: .75rem; margin-top: 1.5rem; }
    .card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: center;
      min-height: 116px;
      padding: 1rem;
      border: 1px solid #252d42;
      border-radius: 18px;
      background: linear-gradient(135deg, #111727, #0d1220);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .2);
    }
    .number {
      display: grid;
      place-items: center;
      width: 58px;
      aspect-ratio: 1;
      border-radius: 16px;
      color: #07101d;
      background: linear-gradient(135deg, #8ef1d0, #86a8ff);
      font-weight: 800;
    }
    h2 { margin: 0 0 .35rem; font-size: 1rem; }
    p { margin: 0; }
    .hint { color: #8290af; font-size: .875rem; }
  </style>
</head>
<body data-status="loading">
  <header>
    <div>
      <h1>Infinite Scroll</h1>
      <div class="status" id="status">Starting…</div>
    </div>
    <button id="toggle" type="button">Pause</button>
  </header>
  <main>
    <p class="intro">
      Scroll down. New entries are loaded before the sentinel reaches the
      viewport. Concurrent requests are guarded automatically.
    </p>
    <section class="feed" id="feed" aria-live="polite"></section>
  </main>

  <script type="module">
    import { InfiniteScroll } from './src/index.js'

    const feed = document.querySelector('#feed')
    const status = document.querySelector('#status')
    const toggle = document.querySelector('#toggle')
    let count = 0
    let paused = false

    function appendBatch(size = 8) {
      const fragment = document.createDocumentFragment()
      for (let index = 0; index < size; index += 1) {
        count += 1
        const article = document.createElement('article')
        article.className = 'card'
        article.innerHTML = `
          <div class="number">${count}</div>
          <div>
            <h2>Feed item ${count}</h2>
            <p class="hint">Loaded by IntersectionObserver without a scroll listener.</p>
          </div>
        `
        fragment.appendChild(article)
      }
      feed.appendChild(fragment)
      status.textContent = `${count} items loaded`
    }

    appendBatch(12)
    const infiniteScroll = new InfiniteScroll(feed, async () => {
      status.textContent = 'Loading next batch…'
      await new Promise(resolve => setTimeout(resolve, 450))
      appendBatch()
    }, {
      threshold: 500,
      onError: error => {
        status.textContent = `Load failed: ${error.message}`
      },
    })

    toggle.addEventListener('click', () => {
      paused = !paused
      infiniteScroll.setLoading(paused)
      toggle.textContent = paused ? 'Resume' : 'Pause'
      status.textContent = paused ? 'Loading paused' : `${count} items loaded`
    })

    document.body.dataset.status = 'pass'
  </script>
</body>
</html>
